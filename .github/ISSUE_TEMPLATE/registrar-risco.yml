name: Cadastrar Novo Risco
description: Formulário para cadastrar os riscos do projeto da equipe.
title: "[Risco] "
labels: ["risco"]
body:
  - type: markdown
    attributes:
      value: |
        ## Cadastro de Riscos do Projeto
        Preencha os campos abaixo com base no planejamento e no protótipo da sua equipe.

        ### Chance de acontecer (Probabilidade)
        - **10% (Muito baixa)**: A equipe domina o assunto e quase não há chance de dar errado.
        - **30% (Baixa)**: Podem surgir pequenas dúvidas, mas a equipe resolve facilmente.
        - **50% (Média)**: A equipe tem incertezas sobre a tecnologia ou como implementar.
        - **70% (Alta)**: Tarefa difícil, tecnologia pouco conhecida ou depende de serviços externos.
        - **90% (Muito alta)**: É quase certeza de que vai dar problema se nada for planejado antes.

        ### Gravidade para o projeto (Impacto)
        - **Muito Baixo**: Ajuste simples e rápido, sem atrapalhar o andamento do projeto.
        - **Baixo**: Afeta apenas detalhes visuais ou funções secundárias do sistema.
        - **Moderado**: Atrasa uma função importante ou gera retrabalho para a equipe.
        - **Alto**: Prejudica uma parte essencial do sistema ou compromete a data de entrega.
        - **Muito Alto**: Impede o funcionamento do sistema ou inviabiliza a entrega do projeto.

        ### Exemplo de Preenchimento
        - **Risco**: Dificuldade para integrar a API de mapas
        - **Causa e consequência**: A equipe ainda não usou a biblioteca de mapas. Isso pode impedir a busca de serviços por proximidade.
        - **Probabilidade**: 50%
        - **Impacto**: Alto
        - **Justificativa**: A equipe nunca usou essa biblioteca antes (50%). A localização no mapa é essencial no protótipo (Alto).
        - **Ação preventiva**: Testar a API logo na primeira semana e estudar a documentação oficial.
        - **Responsável**: Desenvolvedor Front-end

  - type: dropdown
    id: equipe
    attributes:
      label: Equipe
      description: Selecione a sua equipe.
      options:
        - E1
        - E2
        - E3
        - E4
        - E5
    validations:
      required: true

  - type: textarea
    id: risco
    attributes:
      label: Risco (O que pode dar errado)
      description: Diga de forma simples o que pode dar errado.
      placeholder: "Exemplo: Dificuldade para integrar a API de mapas e geolocalização"
    validations:
      required: true

  - type: textarea
    id: causa_consequencia
    attributes:
      label: Causa e consequência
      description: Por que isso pode acontecer e qual o problema se acontecer?
      placeholder: "Exemplo: A equipe ainda não conhece a biblioteca. Se der errado, não vamos conseguir mostrar os serviços por proximidade."
    validations:
      required: true

  - type: dropdown
    id: probabilidade
    attributes:
      label: Probabilidade (Chance de acontecer)
      description: Escolha a chance estimada de acontecer.
      options:
        - 10%
        - 30%
        - 50%
        - 70%
        - 90%
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto (Gravidade para o projeto)
      description: Se acontecer, o quanto atrapalha o projeto?
      options:
        - Muito Baixo
        - Baixo
        - Moderado
        - Alto
        - Muito Alto
    validations:
      required: true

  - type: textarea
    id: justificativa
    attributes:
      label: Justificativa da escolha
      description: Explique brevemente o motivo da escolha de probabilidade e impacto.
      placeholder: "Exemplo: Nunca usamos essa ferramenta antes (50%), e essa função é o ponto central do aplicativo (Alto)."
    validations:
      required: true

  - type: textarea
    id: resposta
    attributes:
      label: Ação preventiva / Resposta ao risco
      description: O que a equipe planeja fazer para evitar o problema ou diminuir o impacto.
      placeholder: "Exemplo: Fazer um teste prático com a biblioteca na primeira semana e estudar a documentação."
    validations:
      required: true

  - type: input
    id: responsavel
    attributes:
      label: Responsável pelo acompanhamento
      description: Nome ou função de quem vai acompanhar esse risco.
      placeholder: "Exemplo: Desenvolvedor Front-end / Nome do aluno"
    validations:
      required: true
