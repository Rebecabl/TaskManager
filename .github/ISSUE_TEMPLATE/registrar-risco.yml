name: Registrar Novo Risco
description: Formulario para registro de riscos de projeto da disciplina LES I.
title: "[Risco] "
labels: ["risco"]
body:
  - type: markdown
    attributes:
      value: |
        ## Pratica de Laboratorio - Analise de Riscos de Software
        Preencha os campos abaixo com base no prototipo e artefatos de planejamento do projeto da sua equipe.

        ### Escala de Probabilidade (Pre-implementacao)
        - **10% (Muito baixa)**: A equipe possui conhecimento e recursos adequados, sem fatores que favorecam a ocorrencia.
        - **30% (Baixa)**: Poucas dificuldades previstas; a equipe possui condicoes adequadas para lidar com elas.
        - **50% (Moderada)**: Incertezas relevantes sobre a implementacao, tecnologia ou capacidade tecnica.
        - **70% (Alta)**: Limitacoes significativas, funcionalidades complexas ou dependencias externas.
        - **90% (Muito alta)**: Fortes indicios de ocorrencia, considerando limitacoes e ausencia de medidas preventivas.

        ### Escala de Impacto (Pre-implementacao)
        - **Muito Baixo**: Podera exigir pequenos ajustes pontuais, sem comprometer funcionalidades ou o planejamento geral.
        - **Baixo**: Podera comprometer funcionalidades secundarias, sem prejudicar os objetivos centrais do software.
        - **Moderado**: Podera comprometer funcionalidade importante, gerar retrabalho ou exigir alteracoes no planejamento.
        - **Alto**: Podera comprometer funcionalidades essenciais, etapas subsequentes ou o prazo de entrega final.
        - **Muito Alto**: Podera inviabilizar a implementacao ou impedir a entrega de um software funcional.

        ### Exemplo de Preenchimento para Referencia
        - **Risco**: Dificuldade na integracao com API externa de geolocalizacao
        - **Causa e consequencia**: Pouca familiaridade com a biblioteca de mapas. Pode inviabilizar a busca de vagas por proximidade geografica.
        - **Probabilidade**: 50%
        - **Impacto**: Alto
        - **Justificativa**: A equipe nunca utilizou essa biblioteca na stack (50%). A localizacao geografica e requisito essencial do prototipo (Alto).
        - **Resposta ao risco**: Mitigar: Desenvolver prova de conceito tecnica na primeira semana e consultar a documentacao oficial.
        - **Responsavel**: Integrante do Front-end

  - type: dropdown
    id: equipe
    attributes:
      label: Equipe
      description: Selecione a equipe responsavel pelo projeto.
      options:
        - E1
        - E2
        - E3
        - E4
        - E5
    validations:
      required: true

  - type: textarea
    id: risco
    attributes:
      label: Risco
      description: Descreva o risco de forma clara e objetiva.
      placeholder: "Exemplo: Dificuldade na integracao com API externa de mapas"
    validations:
      required: true

  - type: textarea
    id: causa_consequencia
    attributes:
      label: Causa e consequência
      description: Explique o que pode causar esse risco e quais as consequencias caso ocorra.
      placeholder: "Exemplo: Causa: Pouca experiencia com a biblioteca. Consequencia: Pode impedir a busca de vagas por proximidade geografica no prototipo."
    validations:
      required: true

  - type: dropdown
    id: probabilidade
    attributes:
      label: Probabilidade
      description: Selecione a probabilidade de acordo com a escala qualitativa.
      options:
        - 10%
        - 30%
        - 50%
        - 70%
        - 90%
    validations:
      required: true

  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      description: Selecione o impacto previsto caso o risco se concretize.
      options:
        - Muito Baixo
        - Baixo
        - Moderado
        - Alto
        - Muito Alto
    validations:
      required: true

  - type: textarea
    id: justificativa
    attributes:
      label: Justificativa da classificação
      description: Justifique por que essa probabilidade e esse impacto foram atribuidos ao risco.
      placeholder: "Exemplo: A equipe nunca utilizou essa biblioteca na stack (50%). A localizacao geografica e requisito essencial do prototipo (Alto)."
    validations:
      required: true

  - type: textarea
    id: resposta
    attributes:
      label: Resposta ao risco
      description: Estrategia de resposta (mitigar, evitar, transferir ou aceitar) e acao preventiva planejada.
      placeholder: "Exemplo: Mitigar: Desenvolver prova de conceito tecnica na primeira semana e consultar a documentacao oficial."
    validations:
      required: true

  - type: input
    id: responsavel
    attributes:
      label: Responsável
      description: Integrante encarregado de acompanhar o risco.
      placeholder: "Exemplo: Integrante responsavel pelo Front-end"
    validations:
      required: true
